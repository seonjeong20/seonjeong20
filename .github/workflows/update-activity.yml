name: Update GitHub activity

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_activity.py
      - .github/workflows/update-activity.yml

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate activity card
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_activity.py
      - name: Save updated card
        run: |
          if git diff --quiet -- assets/github-activity.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-activity.svg
          git commit -m 'chore: refresh GitHub activity card'
          git push
