<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="244" viewBox="0 0 1000 244" role="img" aria-labelledby="title description">
  <title id="title">Seonjeong's activity diary</title>
  <desc id="description">GitHub contribution summary, 2025-11-23 to 2026-11-26. 166 contributions, 122 commits, 30 active days. Public activity when generated with the workflow token.</desc>
  <defs><pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#EDC5D3"/></pattern></defs>
  <rect x="1" y="1" width="998" height="242" rx="8" fill="#FFF5F8" stroke="#DA9DB3"/>
  <path d="M1 49H999" stroke="#E6B4C7"/>
  <rect x="2" y="50" width="996" height="192" fill="url(#dots)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text x="26" y="31" font-family="'Courier New',monospace" font-size="14" fill="#94576D">♡ activity diary</text>
    <text x="972" y="31" text-anchor="end" font-size="12" fill="#996C7F">small steps, saved here.</text>
    <g transform="translate(26,76)">
          <rect width="306" height="126" rx="5" fill="#FFFAFC" stroke="#E6B4C7"/>
          <text x="20" y="26" font-family="'Courier New',monospace" font-size="12" letter-spacing="1" fill="#A66C83">CONTRIBUTIONS</text>
          <text x="20" y="76" font-size="40" font-weight="700" fill="#94576D">166</text>
          <text x="20" y="105" font-size="12" fill="#996C7F">commits + PRs + issues + reviews</text>
        </g><g transform="translate(344,76)">
          <rect width="306" height="126" rx="5" fill="#FFFAFC" stroke="#E6B4C7"/>
          <text x="20" y="26" font-family="'Courier New',monospace" font-size="12" letter-spacing="1" fill="#A66C83">COMMITS</text>
          <text x="20" y="76" font-size="40" font-weight="700" fill="#94576D">122</text>
          <text x="20" y="105" font-size="12" fill="#996C7F">code, one change at a time</text>
        </g><g transform="translate(662,76)">
          <rect width="306" height="126" rx="5" fill="#FFFAFC" stroke="#E6B4C7"/>
          <text x="20" y="26" font-family="'Courier New',monospace" font-size="12" letter-spacing="1" fill="#A66C83">ACTIVE DAYS</text>
          <text x="20" y="76" font-size="40" font-weight="700" fill="#94576D">30</text>
          <text x="20" y="105" font-size="12" fill="#996C7F">days with a contribution</text>
        </g>
    <text x="26" y="226" font-size="11" fill="#94576D">GitHub · public activity · past year</text>
    <text x="972" y="226" text-anchor="end" font-size="11" fill="#94576D">2025-11-23 — 2026-11-26</text>
  </g>
